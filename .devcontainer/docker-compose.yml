# Development container for GitHub Codespaces / VS Code Dev Containers:
# a Node.js 22 workspace plus a PostgreSQL 16 database for local development only.
services:
  app:
    image: mcr.microsoft.com/devcontainers/typescript-node:1-22-bookworm
    volumes:
      - ../..:/workspaces:cached
    command: sleep infinity
    # Share the database container's network so PostgreSQL is reachable at localhost:5432.
    network_mode: service:db

  db:
    image: postgres:16
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: dutch
      POSTGRES_PASSWORD: dutch
      POSTGRES_DB: dutch_dev

volumes:
  postgres-data:
